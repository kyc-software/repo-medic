[project]
name = "repomedic"
version = "0.1.0"
description = "Evidence-backed GitHub issue triage demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.15.0",
  "chromadb>=1.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "joblib>=1.4.0",
  "langgraph>=0.6.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "mlflow>=3.1.0",
  "openai>=1.95.0",
  "pandas>=2.2.0",
  "pydantic-settings>=2.10.0",
  "scikit-learn>=1.7.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "sse-starlette>=2.4.0",
  "typer>=0.16.0",
  "uvicorn[standard]>=0.35.0",
]

[project.scripts]
repomedic = "repomedic.cli.main:main"

[dependency-groups]
dev = [
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "respx>=0.22.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repomedic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "joblib.*", "mlflow.*", "sklearn.*"]
ignore_missing_imports = true
