name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.5
          python-version: "3.12"
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: uv sync --project apps/api --frozen --all-groups
      - run: bun run verify

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api web
